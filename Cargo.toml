[workspace]
members = [
  "bin/rsmpl-git",
  "crates/rsmpl_patch",
  "crates/rsmpl_pattern",
  "crates/rsmpl_engine",
  "crates/rsmpl_git",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
tempfile = "3"
rsmpl_patch = { path = "crates/rsmpl_patch" }
rsmpl_pattern = { path = "crates/rsmpl_pattern" }
rsmpl_engine = { path = "crates/rsmpl_engine" }
rsmpl_git = { path = "crates/rsmpl_git" }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
